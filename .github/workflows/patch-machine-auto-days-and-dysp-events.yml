name: Patch machine auto days and Dysp events

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_machine_auto_days_and_dysp_events.py'
      - '.github/workflows/patch-machine-auto-days-and-dysp-events.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Verify target blobs
        shell: bash
        run: |
          test "$(git hash-object gui_zlecenia.py)" = "349dbb47aa324792a6aeb1623d3371df65c036d3"
          test "$(git hash-object gui_settings.py)" = "de05747dde10d165229b0dc7dc98315b58e55e57"
          test "$(git hash-object maszyny_dyspozycje.py)" = "0d5afb6dbb91db49479ee78402f1231e98cc0503"

      - name: Apply approved patch
        run: python _patch_machine_auto_days_and_dysp_events.py

      - name: Compile changed Python
        run: python -m py_compile gui_zlecenia.py gui_settings.py maszyny_dyspozycje.py

      - name: Targeted checks
        run: |
          python - <<'PY'
          import pathlib

          z = pathlib.Path('gui_zlecenia.py').read_text(encoding='utf-8')
          assert 'root.unbind("<<DyspozycjeUpdated>>", bind_id)' in z
          assert 'if not self._view_is_alive():' in z
          assert 'self._dysp_event_bind_id' in z

          s = pathlib.Path('gui_settings.py').read_text(encoding='utf-8')
          assert 'dyspozycje.machine_cycle.days_before' in s
          assert 'Automatyzacja przeglądów maszyn' in s
          assert 'from_=0' in s and 'to=365' in s

          m = pathlib.Path('maszyny_dyspozycje.py').read_text(encoding='utf-8')
          assert 'AUTO_WINDOW_CONFIG_KEY = "dyspozycje.machine_cycle.days_before"' in m
          assert 'window_days: int | None = None' in m
          assert 'window_days = _configured_auto_window_days()' in m
          assert 'return max(0, min(365, parsed))' in m
          PY

      - name: Diff check
        run: git diff --check

      - name: Commit final change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f _patch_machine_auto_days_and_dysp_events.py
          rm -f .github/workflows/patch-machine-auto-days-and-dysp-events.yml
          git add gui_zlecenia.py gui_settings.py maszyny_dyspozycje.py _patch_machine_auto_days_and_dysp_events.py .github/workflows/patch-machine-auto-days-and-dysp-events.yml
          git diff --cached --check
          git commit -m "fix: configure machine review dispatch timing"
          git push origin HEAD:Rozwiniecie
