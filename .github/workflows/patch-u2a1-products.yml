name: Patch U2A-1 products integration

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_u2a1_products.py'
      - '.github/workflows/patch-u2a1-products.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved U2A-1 patch
        run: python _patch_u2a1_products.py

      - name: Validate Python
        run: |
          python -m py_compile gui_planowanie.py produkty_store.py
          git diff --check

      - name: Validate product catalog compatibility
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          import types
          from pathlib import Path

          fake_config = types.ModuleType('config_manager')
          fake_config.ConfigManager = object
          sys.modules['config_manager'] = fake_config
          from produkty_store import ProductCatalog

          class FakeCfg:
              def __init__(self, root):
                  self.root = Path(root)
              def path_data(self, *parts):
                  return str(self.root / 'data' / Path(*parts))
              def path_backup(self, *parts):
                  return str(self.root / 'backup' / Path(*parts))

          with tempfile.TemporaryDirectory() as tmp:
              cfg = FakeCfg(tmp)
              products = Path(cfg.path_data('produkty'))
              products.mkdir(parents=True, exist_ok=True)
              legacy = products / 'ZBIJAK.json'
              legacy.write_text(json.dumps({
                  'symbol': 'ZBIJAK',
                  'nazwa': 'Zbijak',
                  'polprodukty': [],
                  'czynnosci': ['ciecie']
              }, ensure_ascii=False), encoding='utf-8')

              catalog = ProductCatalog(cfg)
              rows = catalog.list_products()
              assert rows[0]['kod'] == 'ZBIJAK'
              assert json.loads(legacy.read_text(encoding='utf-8')).get('kod') is None

              created = catalog.save_product({
                  'kod': 'HP14 140x200',
                  'nazwa': 'Test',
                  'version': '1.0',
                  'bom_revision': 1,
                  'is_default': True,
              })
              assert created['kod'] == 'HP14 140x200'
              payload = json.loads((products / 'HP14 140x200.json').read_text(encoding='utf-8'))
              assert payload['kod'] == 'HP14 140x200'
              assert payload['polprodukty'] == []
          print('ProductCatalog compatibility OK')
          PY

      - name: Commit only approved U2A-1 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_u2a1_products.py .github/workflows/patch-u2a1-products.yml
          git add gui_planowanie.py produkty_store.py
          git commit -m "feat: add products catalog to planning"
          git push origin Rozwiniecie
