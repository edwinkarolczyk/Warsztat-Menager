name: One-shot fix UI theme recursion

on:
  push:
    branches:
      - Rozwiniecie
    paths:
      - .github/workflows/fix-ui-theme-recursion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Patch ui_theme.py
        run: python .github/patch_ui_theme_recursion.py

      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/fix-ui-theme-recursion.yml
          rm -f .github/patch_ui_theme_recursion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui_theme.py .github/workflows/fix-ui-theme-recursion.yml .github/patch_ui_theme_recursion.py
          git diff --cached --check
          git commit -m "fix: stop recursive theme application"
          git push origin Rozwiniecie
