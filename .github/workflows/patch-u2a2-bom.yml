name: Patch U2A-2 BOM integration

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_u2a2_bom.py'
      - '.github/workflows/patch-u2a2-bom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved U2A-2 patch
        run: python _patch_u2a2_bom.py

      - name: Validate Python
        run: |
          python -m py_compile gui_planowanie.py gui_planowanie_bom.py produkty_store.py polprodukty_store.py
          git diff --check

      - name: Validate stores
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          import types
          from pathlib import Path

          fake_config = types.ModuleType('config_manager')
          fake_config.ConfigManager = object
          sys.modules['config_manager'] = fake_config

          from produkty_store import ProductCatalog
          from polprodukty_store import SemiProductCatalog

          class FakeCfg:
              def __init__(self, root):
                  self.root = Path(root)
              def path_data(self, *parts):
                  return str(self.root / 'data' / Path(*parts))
              def path_backup(self, *parts):
                  return str(self.root / 'backup' / Path(*parts))

          with tempfile.TemporaryDirectory() as tmp:
              cfg = FakeCfg(tmp)
              products = Path(cfg.path_data('produkty'))
              semi_dir = Path(cfg.path_data('polprodukty'))
              products.mkdir(parents=True, exist_ok=True)
              semi_dir.mkdir(parents=True, exist_ok=True)

              legacy_pp = semi_dir / 'OLD PP.json'
              legacy_pp.write_text(json.dumps({
                  'id': 'OLD PP', 'nazwa': 'Stary detal',
                  'surowiec': {'kod': 'SR 1', 'ilosc_na_szt': 0.5, 'jednostka': 'mb'}
              }, ensure_ascii=False), encoding='utf-8')
              semi = SemiProductCatalog(cfg)
              rows = semi.list_items()
              assert rows[0]['kod'] == 'OLD PP'
              assert json.loads(legacy_pp.read_text(encoding='utf-8')).get('kod') is None

              created_pp = semi.save({
                  'kod': 'HP14 detal 1', 'nazwa': 'Detal',
                  'material_kod': 'PRĘT Ø8', 'material_ilosc': '0.6',
                  'material_jednostka': 'mb', 'norma_strat_proc': '2',
                  'czynnosci': 'cięcie, gięcie'
              })
              assert created_pp['surowiec']['kod'] == 'PRĘT Ø8'

              prod_path = products / 'HP14 140x200.json'
              prod_path.write_text(json.dumps({
                  'kod': 'HP14 140x200', 'nazwa': 'Produkt', 'bom_revision': 1,
                  'polprodukty': []
              }, ensure_ascii=False), encoding='utf-8')
              products_catalog = ProductCatalog(cfg)
              product = products_catalog.list_products()[0]
              saved = products_catalog.save_bom(product, [
                  {'kod': 'HP14 detal 1', 'ilosc_na_szt': 2}
              ])
              assert saved['bom_revision'] == 2
              payload = json.loads(prod_path.read_text(encoding='utf-8'))
              assert payload['polprodukty'][0] == {'kod': 'HP14 detal 1', 'ilosc_na_szt': 2}
              assert 'surowiec' not in payload['polprodukty'][0]
          print('U2A-2 store compatibility OK')
          PY

      - name: Commit only approved U2A-2 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_u2a2_bom.py .github/workflows/patch-u2a2-bom.yml
          git add gui_planowanie.py gui_planowanie_bom.py produkty_store.py polprodukty_store.py
          git commit -m "feat: add semiproducts and BOM editor to planning"
          git push origin Rozwiniecie
