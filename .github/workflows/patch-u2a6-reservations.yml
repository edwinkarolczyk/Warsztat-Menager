name: Patch U2A-6 production warehouse reservations

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_u2a6_reservations.py'
      - '.github/workflows/patch-u2a6-reservations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved patch
        run: python _patch_u2a6_reservations.py

      - name: Validate Python and diff
        run: |
          python -m py_compile planowanie_zapotrzebowanie.py planowanie_magazyn.py gui_zlecenia.py
          git diff --check

      - name: Validate reservation bridge
        run: |
          python - <<'PY'
          import sys, types, tempfile
          from pathlib import Path

          tmp = tempfile.TemporaryDirectory()
          root = Path(tmp.name)

          class FakeCfg:
              def path_data(self, *parts):
                  return str(root.joinpath('data', *parts))

          cfg_mod = types.ModuleType('config_manager')
          cfg_mod.ConfigManager = FakeCfg
          sys.modules['config_manager'] = cfg_mod

          state = {
              'PP1': {'id':'PP1','kod':'PP1','nazwa':'Zbijak','typ':'półprodukt','jednostka':'szt.','stan':100.0,'rezerwacje':0.0},
              'DR8': {'id':'DR8','kod':'DR8','nazwa':'Drut fi 8','typ':'materiał','jednostka':'mm','stan':100000.0,'rezerwacje':0.0},
          }

          lm = types.ModuleType('logika_magazyn')
          lm.load_magazyn = lambda include_external=True: {'items': {k:dict(v) for k,v in state.items()}}

          def rezerwuj(item_id, qty, user, kontekst=None):
              row = state[item_id]
              free = row['stan'] - row.get('rezerwacje', 0.0)
              got = min(float(qty), free)
              row['rezerwacje'] = row.get('rezerwacje', 0.0) + got
              return got

          def zwolnij(item_id, qty, user, kontekst=None):
              row = state[item_id]
              row['rezerwacje'] = max(0.0, row.get('rezerwacje', 0.0) - float(qty))
              return row

          def zuzyj(item_id, qty, user, kontekst=None):
              row = state[item_id]
              qty = float(qty)
              if row['stan'] < qty:
                  raise ValueError('insufficient')
              row['stan'] -= qty
              return row

          def upsert(item):
              state[item['id']] = dict(item)
              return state[item['id']]

          lm.rezerwuj = rezerwuj
          lm.zwolnij_rezerwacje = zwolnij
          lm.zuzyj = zuzyj
          lm.upsert_item = upsert
          lm._log_mag = lambda *a, **k: None
          sys.modules['logika_magazyn'] = lm

          import planowanie_magazyn as pm

          rows = [
              {'kod':'PP1','jednostka':'szt.','z_magazynu':60},
              {'kod':'DR8','jednostka':'mm','z_magazynu':5000},
          ]
          reserved = pm.reserve_execution_requirements('DYSP-TEST', rows, user='test')
          assert len(reserved) == 2
          assert state['PP1']['rezerwacje'] == 60
          assert state['DR8']['rezerwacje'] == 5000

          snapshot = pm.stock_snapshot_for_operation('DYSP-TEST')
          assert snapshot['pp1']['wolne'] >= 40

          consumed = pm.reconcile_and_consume_execution('DYSP-TEST', rows, user='test')
          assert len(consumed) == 2
          assert state['PP1']['rezerwacje'] == 0
          assert state['DR8']['rezerwacje'] == 0
          assert state['PP1']['stan'] == 40
          assert state['DR8']['stan'] == 95000

          again = pm.reconcile_and_consume_execution('DYSP-TEST', rows, user='test')
          assert state['PP1']['stan'] == 40
          assert state['DR8']['stan'] == 95000
          print('Reservation bridge OK')
          tmp.cleanup()
          PY

      - name: Commit approved source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_u2a6_reservations.py .github/workflows/patch-u2a6-reservations.yml
          git add planowanie_zapotrzebowanie.py planowanie_magazyn.py gui_zlecenia.py
          git commit -m "feat: settle production reservations with warehouse"
          git push origin Rozwiniecie
