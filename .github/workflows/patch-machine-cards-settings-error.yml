name: Patch machine cards and settings error

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_machine_cards_settings_error.py'
      - '.github/workflows/patch-machine-cards-settings-error.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply narrow patch
        run: python _patch_machine_cards_settings_error.py

      - name: Verify scope and syntax
        shell: bash
        run: |
          python -m py_compile gui_maszyny.py gui_settings.py
          python - <<'PY'
          from pathlib import Path

          machines = Path('gui_maszyny.py').read_text(encoding='utf-8')
          settings = Path('gui_settings.py').read_text(encoding='utf-8')

          assert '# version: 1.6' in machines
          assert 'SCHEDULE_YEAR = dt.date.today().year' in machines
          assert 'from gui_dyspozycje_creator import open_dyspozycje_creator' in machines
          assert 'from wm.dyspo_wizard' not in machines
          assert 'Path(ConfigManager().path_root("wydruki", "karty"))' in machines
          assert 'base = Path.cwd() / "wydruki" / "karty"' not in machines

          assert '# version: 1.0.5' in settings
          assert 'parent=self.win' not in settings
          assert settings.count('parent=parent.winfo_toplevel()') >= 2
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' gui_maszyny.py gui_settings.py | sort)"
          test "$changed" = "$expected"

      - name: Commit approved files only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_maszyny.py gui_settings.py
          git rm _patch_machine_cards_settings_error.py .github/workflows/patch-machine-cards-settings-error.yml
          git commit -m "fix: finish machine paths and settings save"
          git push origin Rozwiniecie
