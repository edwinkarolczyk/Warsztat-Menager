name: Patch shift rotation

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-shift-rotation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Verify approved source versions
        shell: bash
        run: |
          test "$(git hash-object gui_logowanie.py)" = "4d0442fb3ba60f6911c9b360c1e858d57b8a4d87"
          test "$(git hash-object grafiki/shifts_schedule.py)" = "388f9a1fb994cf49b13fa4c7eefeeb6d7349b04e"

      - name: Apply narrow patch
        run: python _patch_shift_rotation.py

      - name: Compile changed Python files
        run: python -m py_compile gui_logowanie.py grafiki/shifts_schedule.py

      - name: Test approved rotation rules without importing GUI
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from datetime import date, datetime, timedelta
          from pathlib import Path

          def load_function(path, name, namespace):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              node = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name)
              module = ast.Module(body=[node], type_ignores=[])
              exec(compile(module, path, 'exec'), namespace)
              return namespace[name]

          anchor = date(2026, 1, 5)
          ns_login = {
              '_user_workdays': lambda _p: list(range(7)),
              '_user_shift_mode': lambda p: p['tryb_zmian'],
              '_global_rotation_start': lambda: anchor,
          }
          slot_for_user = load_function('gui_logowanie.py', '_slot_for_user', ns_login)

          def seq_login(mode, weeks=6):
              return [slot_for_user({'tryb_zmian': mode}, datetime.combine(anchor + timedelta(days=7*i), datetime.min.time())) for i in range(weeks)]

          assert seq_login('111') == ['RANO'] * 6
          assert seq_login('222') == ['POPO'] * 6
          assert seq_login('121') == ['RANO', 'POPO', 'RANO', 'POPO', 'RANO', 'POPO']
          assert seq_login('212') == ['POPO', 'RANO', 'POPO', 'RANO', 'POPO', 'RANO']

          ns_sched = {'_available_patterns': lambda: {'111':'111','222':'222','121':'121','212':'212'}}
          slot_for_mode = load_function('grafiki/shifts_schedule.py', '_slot_for_mode', ns_sched)
          assert [slot_for_mode('111', i) for i in range(6)] == ['RANO'] * 6
          assert [slot_for_mode('222', i) for i in range(6)] == ['POPO'] * 6
          assert [slot_for_mode('121', i) for i in range(6)] == ['RANO', 'POPO', 'RANO', 'POPO', 'RANO', 'POPO']
          assert [slot_for_mode('212', i) for i in range(6)] == ['POPO', 'RANO', 'POPO', 'RANO', 'POPO', 'RANO']
          print('rotation rules OK')
          PY

      - name: Diff checks
        shell: bash
        run: |
          git diff --check
          git diff --name-only | sort
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "grafiki/shifts_schedule.py gui_logowanie.py "

      - name: Commit approved source changes and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm _patch_shift_rotation.py .github/workflows/patch-shift-rotation.yml
          git add gui_logowanie.py grafiki/shifts_schedule.py
          git add -u _patch_shift_rotation.py .github/workflows/patch-shift-rotation.yml
          git commit -m "fix: make user shifts alternate weekly"
          git push origin HEAD:Rozwiniecie
