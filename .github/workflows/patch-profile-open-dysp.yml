name: Patch profile open Dyspozycja

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-profile-open-dysp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin Rozwiniecie
      - name: Apply approved patch
        run: python3 _patch_profile_open_dysp.py
      - name: Compile
        run: python3 -m py_compile gui_profile.py
      - name: Static checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('gui_profile.py').read_text(encoding='utf-8')
          active = text[text.index('class ProfileView'):]
          assert 'text="Otwórz Dyspozycję"' in active
          assert 'tree.bind("<Double-1>", _open_selected_dyspozycja)' in active
          assert 'context["edit_mode"] = True' in active
          assert 'from gui_dyspozycje_creator import open_dyspozycje_creator' in active
          print('Static checks: OK')
          PY
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "gui_profile.py"
      - name: Commit source and cleanup
        run: |
          git add gui_profile.py
          git rm _patch_profile_open_dysp.py .github/workflows/patch-profile-open-dysp.yml
          git commit -m "feat: open Dyspozycje from profile"
          git push origin Rozwiniecie
