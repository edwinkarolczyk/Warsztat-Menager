name: Fix U2A-5 escape

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_fix_u2a5_escape.py'
      - '.github/workflows/fix-u2a5-escape.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0
      - name: Fix helper escaping
        run: python _fix_u2a5_escape.py
      - name: Validate helper
        run: python -m py_compile _patch_u2a5_dysp.py
      - name: Commit helper fix and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _fix_u2a5_escape.py .github/workflows/fix-u2a5-escape.yml
          git add _patch_u2a5_dysp.py
          git commit -m "chore: fix U2A-5 helper escaping"
          git push origin Rozwiniecie
