name: One-shot version footer

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/one-shot-version-footer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply version footer and SemVer policy
        shell: python
        run: |
          from pathlib import Path

          version = Path('__version__.py')
          text = version.read_text(encoding='utf-8')
          text = text.replace('__version__ = "0.2"', '__version__ = "0.3.0"')
          text = text.replace(
              'Podnosimy wyłącznie tutaj (albo przez tools/bump_version.py).',
              'Podnosimy wyłącznie tutaj (albo przez tools/bump_version.py).\n\nZasada SemVer dla WM:\n- PATCH (x.y.Z): poprawki błędów i kosmetyka bez zmiany zachowania,\n- MINOR (x.Y.0): nowe funkcje i istotne usprawnienia zgodne wstecznie,\n- MAJOR (X.0.0): zmiany niekompatybilne lub duża przebudowa aplikacji.'
          )
          version.write_text(text, encoding='utf-8')

          panel = Path('gui_panel.py')
          text = panel.read_text(encoding='utf-8')
          text = text.replace('# WM-VERSION: 0.1', '# WM-VERSION: 0.3.0', 1)
          text = text.replace('# version: 1.6.18', '# version: 1.6.19', 1)
          marker = '# Zmiany 1.6.18:'
          if '# Zmiany 1.6.19:' not in text:
              text = text.replace(marker, '# Zmiany 1.6.19:\n# - Dodano numer aktualnej wersji aplikacji do stałej stopki głównego panelu.\n' + marker, 1)
          needle = '    footer_btns = ttk.Frame(footer, style="WM.TFrame"); footer_btns.pack(side="right")\n'
          insert = needle + '    ttk.Label(\n        footer,\n        text=f"Warsztat Menager v{APP_VERSION}",\n        style="WM.Muted.TLabel",\n    ).pack(side="left")\n'
          if 'text=f"Warsztat Menager v{APP_VERSION}"' not in text:
              if needle not in text:
                  raise SystemExit('Nie znaleziono miejsca stopki w gui_panel.py')
              text = text.replace(needle, insert, 1)
          panel.write_text(text, encoding='utf-8')

          checker = Path('wymagane_pliki_version_check.py')
          text = checker.read_text(encoding='utf-8')
          text = text.replace('"gui_panel.py": "1.6.17"', '"gui_panel.py": "1.6.19"')
          checker.write_text(text, encoding='utf-8')

          tool = Path('tools/bump_version.py')
          tool.parent.mkdir(parents=True, exist_ok=True)
          tool.write_text('''# version: 1.0\n"""Podnosi centralną wersję Warsztat Menager zgodnie z SemVer."""\n\nfrom __future__ import annotations\n\nimport argparse\nimport re\nfrom pathlib import Path\n\nVERSION_FILE = Path(__file__).resolve().parents[1] / "__version__.py"\nRX = re.compile(r'__version__\\s*=\\s*["\\\'](\\d+)(?:\\.(\\d+))?(?:\\.(\\d+))?["\\\']')\n\ndef bump(kind: str) -> str:\n    text = VERSION_FILE.read_text(encoding="utf-8")\n    match = RX.search(text)\n    if not match:\n        raise RuntimeError("Nie znaleziono __version__ w __version__.py")\n    major, minor, patch = (int(match.group(1)), int(match.group(2) or 0), int(match.group(3) or 0))\n    if kind == "patch":\n        patch += 1\n    elif kind == "minor":\n        minor += 1; patch = 0\n    elif kind == "major":\n        major += 1; minor = 0; patch = 0\n    else:\n        raise ValueError(kind)\n    new = f"{major}.{minor}.{patch}"\n    start, end = match.span()\n    text = text[:start] + f'__version__ = "{new}"' + text[end:]\n    VERSION_FILE.write_text(text, encoding="utf-8")\n    return new\n\ndef main() -> int:\n    parser = argparse.ArgumentParser(description="Podnieś wersję WM zgodnie z SemVer")\n    parser.add_argument("kind", choices=("patch", "minor", "major"))\n    args = parser.parse_args()\n    print(bump(args.kind))\n    return 0\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''', encoding='utf-8')

          test = Path('tests/test_app_version_footer.py')
          test.write_text('''# version: 1.0\nfrom pathlib import Path\n\ndef test_main_footer_shows_central_app_version():\n    text = Path("gui_panel.py").read_text(encoding="utf-8")\n    assert 'text=f"Warsztat Menager v{APP_VERSION}"' in text\n\ndef test_central_version_uses_three_part_semver():\n    from __version__ import get_version\n    parts = get_version().split(".")\n    assert len(parts) == 3\n    assert all(part.isdigit() for part in parts)\n''', encoding='utf-8')

      - name: Verify
        run: |
          python -m py_compile __version__.py gui_panel.py wymagane_pliki_version_check.py tools/bump_version.py tests/test_app_version_footer.py
          python -m pytest -q tests/test_app_version_footer.py

      - name: Commit final fix and remove one-shot workflow
        run: |
          git config user.name "edwinkarolczyk"
          git config user.email "edwinkarolczyk@gmail.com"
          git rm .github/workflows/one-shot-version-footer.yml
          git add __version__.py gui_panel.py wymagane_pliki_version_check.py tools/bump_version.py tests/test_app_version_footer.py
          git commit -m "feat: pokazuj wersje WM w stopce i stosuj SemVer"
          git push origin HEAD:Rozwiniecie
