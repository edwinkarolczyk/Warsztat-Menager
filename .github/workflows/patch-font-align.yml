name: Patch module fonts to Dyspozycje

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_match_dysp_fonts.py'
      - '.github/workflows/patch-font-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved font patch
        run: python _patch_match_dysp_fonts.py

      - name: Validate Python and exact styles
        run: |
          python -m py_compile narzedzia_ui/list_panel.py gui_maszyny.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          tools = Path('narzedzia_ui/list_panel.py').read_text(encoding='utf-8')
          machines = Path('gui_maszyny.py').read_text(encoding='utf-8')
          assert tools.count('font=("Segoe UI", 11), rowheight=30') >= 1
          assert 'Tools.Treeview.Heading", font=("Segoe UI", 11, "bold")' in tools
          assert tools.count('_apply_dysp_table_font(self.tv_') == 3
          assert 'Maszyny.Treeview", font=("Segoe UI", 11), rowheight=30' in machines
          assert 'Maszyny.Treeview.Heading", font=("Segoe UI", 11, "bold")' in machines
          PY

      - name: Commit approved source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add narzedzia_ui/list_panel.py gui_maszyny.py
          git rm -f _patch_match_dysp_fonts.py .github/workflows/patch-font-align.yml
          git commit -m "style: align tools and machines fonts with dyspozycje"
          git push origin Rozwiniecie
