name: One-shot fix startup git freeze
on:
  push:
    branches: [Rozwiniecie]
permissions:
  contents: write
jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'fix: prevent startup git operations')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
      - name: Patch start.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('start.py')
          s = p.read_text(encoding='utf-8')

          old_header = '''# WM-VERSION: 0.1\n# version: 1.0\n# Moduł: start\n'''
          new_header = '''# WM-VERSION: 0.1\n# version: 1.1.3\n# Moduł: start\n# Zmiany 1.1.3:\n# - Wyłączono synchroniczne operacje Git przy starcie aplikacji, aby sieć/repozytorium nie blokowały GUI.\n# - Aktualizacja repozytorium nie jest wykonywana automatycznie przed uruchomieniem okna WM.\n'''
          if old_header in s:
              s = s.replace(old_header, new_header, 1)

          start = s.index('def auto_update_on_start():')
          end = s.index('\n# ====== USER FILE (NOWE) ======', start)
          replacement = '''def auto_update_on_start():\n    \"\"\"Automatyczna aktualizacja przy starcie jest celowo wyłączona.\n\n    Aktualizacje Git wykonywane synchronicznie podczas startu potrafią zablokować\n    główny wątek aplikacji (np. oczekiwanie na sieć, Git lub blokadę repozytorium).\n    Zostawiamy updater dostępny dla późniejszego uruchomienia ręcznego/asynchronicznego.\n    \"\"\"\n    return False\n'''
          s = s[:start] + replacement + s[end:]

          old_update_available = '    update_available = _git_has_updates(Path.cwd())\n'
          new_update_available = '    # Nie wykonujemy sieciowego Git check podczas startu GUI.\n    update_available = False\n'
          if old_update_available not in s:
              raise SystemExit('Nie znaleziono update_available w main()')
          s = s.replace(old_update_available, new_update_available, 1)

          old_bottom = '    _wm_git_check_on_start()\n    main()\n'
          new_bottom = '    # Git check/pull przy starcie wyłączony: nie blokujemy uruchamiania WM.\n    main()\n'
          if old_bottom not in s:
              raise SystemExit('Nie znaleziono wywołania _wm_git_check_on_start()')
          s = s.replace(old_bottom, new_bottom, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-startup-git-freeze.yml
          git add start.py .github/workflows/fix-startup-git-freeze.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent startup git operations from blocking WM'
          git push origin HEAD:Rozwiniecie