name: R07 Smoke

on:
  push:
    branches: [ Rozwiniecie ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytest
      - name: Compile whole repository
        run: |
          python -m compileall -q .
      - name: Run smoke tests (settings)
        run: |
          pytest -q \
            tests/test_settings_manager.py \
            tests/test_settings_dirty_state_v2.py \
            tests/test_profile_settings_navigation.py \
            tests/test_windows_restart_compat.py
      - name: Run production planning regressions
        run: |
          pytest -q \
            tests/test_production_bom_reservation.py \
            tests/test_production_workflow_v2.py \
            tests/test_production_progress_v3.py
      - name: Compile hall and machine extension
        run: |
          python -m py_compile \
            gui_maszyny.py \
            widok_hali/rooms.py \
            widok_hali/machine_rooms_patch.py \
            widok_hali/machine_rooms_persistence.py \
            widok_hali/machine_rooms_ui_patch.py \
            widok_hali/machine_rooms_editor_patch.py \
            widok_hali/machine_usage_location_patch.py \
            widok_hali/machine_drag_location_feedback.py
      - name: Run hall and machine integration tests
        run: |
          pytest -q \
            tests/test_hall_rooms.py \
            tests/test_gui_maszyny_rooms_integration.py \
            tests/test_gui_maszyny_rooms_persistence.py \
            tests/test_gui_maszyny_room_ui.py \
            tests/test_gui_maszyny_room_editor.py \
            tests/test_gui_maszyny_usage_location.py \
            tests/test_machine_review_correction_runtime.py
      - name: Run Tk hall/profile smoke under Xvfb
        run: |
          xvfb-run -a pytest -q \
            tests/test_gui_maszyny_rooms_tk_smoke.py \
            tests/test_gui_maszyny_usage_location_tk.py \
            tests/test_gui_maszyny_drag_location_feedback_tk.py \
            tests/test_profile_settings_runtime_tk.py \
            tests/test_profile_admin_foreman_tk.py \
            tests/test_profile_own_edit_tk.py \
            tests/test_profile_user_actions_tk.py
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sprawdź nagłówki wersji
        run: python wymagane_pliki_version_check.py
      - name: Bootstrap ścieżek danych (dry-run)
        run: python -m core.bootstrap --config config.defaults.json
      - name: Weryfikacja przycisków GUI
        run: python 'narzędzia/check_buttons_refs.py' --root . --report reports/buttons_report.md
      - name: Podgląd raportu przycisków
        run: cat reports/buttons_report.md
