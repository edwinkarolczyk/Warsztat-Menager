name: Integrate startup diagnostics
on:
  push:
    branches: [Rozwiniecie]
permissions:
  contents: write
jobs:
  integrate:
    if: "!startsWith(github.event.head_commit.message, 'debug: integrate startup diagnostics')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
      - name: Integrate checkpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('start.py')
          s = p.read_text(encoding='utf-8')
          imp = 'from wm_startup_debug import checkpoint as _wm_startup_checkpoint\n'
          anchor = 'from config_manager import ConfigManager\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('missing import anchor')
              s = s.replace(anchor, anchor + imp, 1)
          s = s.replace('def main():\n', 'def main():\n    _wm_startup_checkpoint("MAIN_ENTER")\n', 1)
          reps = [
            ('    if wm_root_paths is not None:\n', '    _wm_startup_checkpoint("BEFORE_ROOT_BOOTSTRAP")\n    if wm_root_paths is not None:\n', 1),
            ('    manager = _ensure_config_manager()\n', '    _wm_startup_checkpoint("BEFORE_CONFIG_MANAGER")\n    manager = _ensure_config_manager()\n    _wm_startup_checkpoint("AFTER_CONFIG_MANAGER", ok=manager is not None)\n', 1),
            ('    _post_config_bootstrap()\n', '    _post_config_bootstrap()\n    _wm_startup_checkpoint("AFTER_CONFIG_BOOTSTRAP")\n', 1),
            ('    minimize_console()\n', '    _wm_startup_checkpoint("BEFORE_CONSOLE_MINIMIZE")\n    if os.environ.get("WM_STARTUP_DEBUG", "1").strip().lower() not in {"0", "false", "off", "no"}:\n        _wm_startup_checkpoint("CONSOLE_MINIMIZE_SKIPPED_DEBUG")\n    else:\n        minimize_console()\n', 1),
            ('    jarvis_stop_fn = None\n', '    _wm_startup_checkpoint("AFTER_UPDATE_CHECKS_BEFORE_JARVIS")\n    jarvis_stop_fn = None\n', 1),
            ('        root = tk.Tk()\n', '        _wm_startup_checkpoint("BEFORE_TK_CREATE")\n        root = tk.Tk()\n        _wm_startup_checkpoint("AFTER_TK_CREATE")\n', 1),
            ('        _show_tutorial_if_first_run(root)\n', '        _show_tutorial_if_first_run(root)\n        _wm_startup_checkpoint("AFTER_TUTORIAL")\n', 1),
            ('            import gui_logowanie\n', '            _wm_startup_checkpoint("BEFORE_LOGIN_IMPORT")\n            import gui_logowanie\n            _wm_startup_checkpoint("AFTER_LOGIN_IMPORT")\n', 1),
            ('            returned_root = gui_logowanie.ekran_logowania(\n', '            _wm_startup_checkpoint("BEFORE_LOGIN_SCREEN")\n            returned_root = gui_logowanie.ekran_logowania(\n', 1),
            ('        root.mainloop()\n', '        _wm_startup_checkpoint("BEFORE_MAINLOOP")\n        root.mainloop()\n', 1),
          ]
          for old,new,count in reps:
              if old not in s: raise SystemExit(f'missing anchor: {old[:80]!r}')
              s = s.replace(old,new,count)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/integrate-startup-debug.yml
          git add start.py wm_startup_debug.py .github/workflows/integrate-startup-debug.yml
          git diff --cached --quiet && exit 0
          git commit -m 'debug: integrate startup diagnostics'
          git push origin HEAD:Rozwiniecie
