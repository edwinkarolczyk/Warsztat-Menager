name: Patch profile and Dyspozycje cleanup

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-profile-dysp-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rozwiniecie
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin Rozwiniecie

      - name: Apply approved patch
        run: python3 _patch_profile_dysp_cleanup.py

      - name: Compile changed Python files
        run: python3 -m py_compile gui_profile.py gui_dyspozycje_creator.py dyspozycje_sources.py

      - name: Static behavior checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('gui_profile.py').read_text(encoding='utf-8')
          creator = Path('gui_dyspozycje_creator.py').read_text(encoding='utf-8')
          sources = Path('dyspozycje_sources.py').read_text(encoding='utf-8')

          active = profile[profile.index('class ProfileView'):]
          reload_part = active[active.index('    def _reload_profile_data('):active.index('    def _render_tab(')]
          assert 'visible_for_login(self.login)' in reload_part
          assert 'get_tasks_for(' not in reload_part
          assert '_collect_tool_tasks(' not in reload_part
          init_part = active[active.index('    def __init__('):active.index('    def load_by_login(')]
          assert 'self._build_simple_profile()' in init_part
          assert 'self._build_tabs()' not in init_part
          assert 'self._build_columns()' not in init_part

          assert '"zlecenie_wykonania": "Wykonanie produkcji"' in creator
          assert 'textvariable=var_type_display' in creator
          assert 'values=list(_DYSP_TYPE_LABELS.values())' in creator
          assert 'var_type.set(_dysp_type_value(var_type_display.get()))' in creator

          mag = sources[sources.index('def load_magazyn_choices()'):sources.index('# ZLECENIE WYKONANIA')]
          assert 'load_magazyn(include_external=True)' in mag
          assert 'magazyn_candidates' not in mag
          assert 'data.get("pozycje") or data.get("items")' in mag
          print('Static checks: OK')
          PY

      - name: Diff validation
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {'gui_profile.py', 'gui_dyspozycje_creator.py', 'dyspozycje_sources.py'}
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          extra = changed - allowed
          if extra:
              raise SystemExit(f'Unexpected changed files: {sorted(extra)}')
          if changed != allowed:
              raise SystemExit(f'Expected exactly {sorted(allowed)}, got {sorted(changed)}')
          print('Scope check: OK')
          PY

      - name: Commit source changes and remove one-shot files
        run: |
          git add gui_profile.py gui_dyspozycje_creator.py dyspozycje_sources.py
          git rm _patch_profile_dysp_cleanup.py .github/workflows/patch-profile-dysp-cleanup.yml
          git commit -m "feat: simplify profile and Dyspozycje sources"
          git push origin Rozwiniecie
