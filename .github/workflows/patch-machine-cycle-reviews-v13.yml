name: Patch machine cyclic reviews v1.3

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_machine_cycle_reviews_v13.py'
      - '.github/workflows/patch-machine-cycle-reviews-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved cyclic review patch
        run: python _patch_machine_cycle_reviews_v13.py

      - name: Validate Python and scope
        run: |
          python -m py_compile gui_maszyny.py
          git diff --check
          test "$(git diff --name-only)" = "gui_maszyny.py"

      - name: Install Tkinter for isolated import
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - name: Validate cyclic review bridge
        run: |
          python - <<'PY'
          import datetime as dt
          import gui_maszyny as gm

          today = dt.date(2026, 8, 26)
          machine = {
              'review_months': [1, 5, 9],
              'reviews': [],
          }
          entries = gm._combined_machine_review_entries(machine, today=today, years_ahead=1)
          current_cycles = {
              gm._review_date(item.get('date')).month
              for item in entries
              if item.get('source') == gm.REVIEW_SOURCE_CYCLE
              and gm._review_date(item.get('date'))
              and gm._review_date(item.get('date')).year == 2026
          }
          assert {1, 5, 9}.issubset(current_cycles), current_cycles

          machine['reviews'] = [{
              'id': 'rev_cycle_sep',
              'type': 'Przegląd okresowy',
              'planned_date': '2026-09-01',
              'status': 'in_progress',
              'source': gm.REVIEW_SOURCE_CYCLE,
          }]
          entries = gm._combined_machine_review_entries(machine, today=today, years_ahead=1)
          september = [
              item for item in entries
              if gm._review_date(item.get('date')) == dt.date(2026, 9, 1)
              and item.get('source') == gm.REVIEW_SOURCE_CYCLE
          ]
          assert len(september) == 1, september
          assert september[0].get('status') == 'in_progress', september
          print('cyclic review bridge OK')
          PY

      - name: Commit approved source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_maszyny.py
          git rm -f _patch_machine_cycle_reviews_v13.py .github/workflows/patch-machine-cycle-reviews-v13.yml
          git commit -m "feat: show cyclic machine reviews in service list"
          git push origin Rozwiniecie
