name: One-shot Dyspozycje date/search polish

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-dysp-stage1-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
      - name: Patch creator
        run: python _patch_dysp_stage1_2.py
      - name: Compile
        run: python -m py_compile gui_dyspozycje_creator.py
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_dyspozycje_creator.py
          git rm .github/workflows/patch-dysp-stage1-2.yml _patch_dysp_stage1_2.py
          git commit -m "fix: polish Dyspozycje date and search fields"
          git push origin HEAD:Rozwiniecie
