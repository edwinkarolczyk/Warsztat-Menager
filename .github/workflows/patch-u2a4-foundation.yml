name: Patch U2A-4 warehouse planning integration

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_u2a4_foundation.py'
      - '.github/workflows/patch-u2a4-foundation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved patch
        run: python _patch_u2a4_foundation.py

      - name: Validate Python
        run: |
          python -m py_compile gui_planowanie.py gui_planowanie_bom.py gui_polprodukt_sklad.py polprodukty_store.py planowanie_magazyn.py planowanie_zapotrzebowanie.py
          git diff --check

      - name: Validate requirement engine with warehouse surplus
        run: |
          python - <<'PY'
          import sys, types

          fake_cfg = types.ModuleType('config_manager')
          fake_cfg.ConfigManager = object
          sys.modules['config_manager'] = fake_cfg

          fake_wh = types.ModuleType('planowanie_magazyn')
          fake_wh.load_stock_snapshot = lambda: {
              'zbijak': {'stan': 140, 'wolne': 140, 'jednostka': 'szt'},
              'drut fi 8': {'stan': 100000, 'wolne': 100000, 'jednostka': 'mm'},
              'oczko': {'stan': 2000, 'wolne': 2000, 'jednostka': 'szt'},
              'drut fi 2': {'stan': 100000, 'wolne': 100000, 'jednostka': 'mm'},
          }
          sys.modules['planowanie_magazyn'] = fake_wh

          from planowanie_zapotrzebowanie import RequirementCalculator, unique_order_number

          assert unique_order_number('1254', [{'id':'1','number':'1254'}, {'id':'2','number':'1254_2'}]) == '1254_3'

          class Products:
              cfg = None
              def list_products(self):
                  return [{
                      'kod':'P1','nazwa':'Produkt','bom_revision':1,
                      'polprodukty':[
                          {'kod':'ZBIJAK','ilosc_na_szt':20},
                          {'kod':'LANCUCH','ilosc_na_szt':20},
                      ]
                  }]

          class Semis:
              def list_items(self):
                  return [
                      {'kod':'ZBIJAK','nazwa':'Zbijak','sklad':[], 'surowiec':{'kod':'DRUT FI 8','ilosc_na_szt':100,'jednostka':'mm'}, 'norma_strat_proc':0, '_raw':{'sklad':[]}},
                      {'kod':'LANCUCH','nazwa':'Łańcuszek','sklad':[{'kod':'OCZKO','ilosc_na_szt':20}], 'surowiec':{}, 'norma_strat_proc':0, '_raw':{'sklad':[{'kod':'OCZKO','ilosc_na_szt':20}]}},
                      {'kod':'OCZKO','nazwa':'Oczko','sklad':[], 'surowiec':{'kod':'DRUT FI 2','ilosc_na_szt':50,'jednostka':'mm'}, 'norma_strat_proc':0, '_raw':{'sklad':[]}},
                  ]

          calc = RequirementCalculator(Products(), Semis())
          result = calc.calculate_with_stock('P1', 30)
          by = {(r['typ'], r['kod']): r for r in result['rows']}
          assert by[('Półprodukt','ZBIJAK')]['ilosc'] == 600
          assert by[('Półprodukt','ZBIJAK')]['z_magazynu'] == 140
          assert by[('Półprodukt','ZBIJAK')]['brak'] == 460
          assert by[('Surowiec','DRUT FI 8')]['ilosc'] == 46000
          assert by[('Półprodukt','LANCUCH')]['ilosc'] == 600
          assert by[('Półprodukt','OCZKO')]['ilosc'] == 12000
          assert by[('Półprodukt','OCZKO')]['z_magazynu'] == 2000
          assert by[('Półprodukt','OCZKO')]['brak'] == 10000
          assert by[('Surowiec','DRUT FI 2')]['ilosc'] == 500000
          print('U2A-4 requirement engine OK')
          PY

      - name: Commit approved source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_u2a4_foundation.py .github/workflows/patch-u2a4-foundation.yml
          git add gui_planowanie.py gui_planowanie_bom.py gui_polprodukt_sklad.py polprodukty_store.py planowanie_magazyn.py planowanie_zapotrzebowanie.py
          git commit -m "feat: connect planning requirements with warehouse"
          git push origin Rozwiniecie
