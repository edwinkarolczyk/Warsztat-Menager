name: Patch UI sizing

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-ui-sizing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rozwiniecie
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin Rozwiniecie

      - name: Apply approved patch
        run: python3 _patch_ui_sizing.py

      - name: Compile
        run: python3 -m py_compile gui_maszyny.py narzedzia_ui/list_panel.py narzedzia_ui/detail_view.py utils_maszyny.py

      - name: Test machine loader
        run: |
          python3 - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from utils_maszyny import load_machines_rows_with_fallback

          with tempfile.TemporaryDirectory() as tmp:
              data_root = Path(tmp) / "data"
              path = data_root / "maszyny" / "maszyny.json"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps({"maszyny": [{"id": "65", "nazwa": "Test"}]}), encoding="utf-8")

              def resolve_rel(_cfg, what):
                  rel = str(what).replace('\\\\', '/').replace('\\', '/')
                  return os.path.normpath(os.path.join(str(data_root), rel))

              rows, primary = load_machines_rows_with_fallback({}, resolve_rel)
              assert len(rows) == 1, rows
              assert rows[0].get("id") == "65", rows
              assert os.path.normpath(primary) == os.path.normpath(str(path)), (primary, path)
          print("Machine loader synthetic test: OK")
          PY

      - name: Structural checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          machines = Path('gui_maszyny.py').read_text(encoding='utf-8')
          tools = Path('narzedzia_ui/list_panel.py').read_text(encoding='utf-8')
          detail = Path('narzedzia_ui/detail_view.py').read_text(encoding='utf-8')

          assert '# version: 1.8' in machines
          assert 'font=("Segoe UI", 9, "bold")' in machines
          assert 'load_machines_rows_with_fallback(cfg, resolve_rel)' in machines
          assert '# version: 1.2' in tools
          assert '_DEFAULT_WIDTH = 1180' in tools
          assert '_DEFAULT_HEIGHT = 700' in tools
          assert 'self.window.minsize(1000, 620)' in tools
          assert '# version: 1.1' in detail
          assert 'self.window.geometry("900x650")' in detail
          assert 'self.window.minsize(800, 560)' in detail
          print('Structural checks: OK')
          PY

      - name: Diff validation
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          expected = {'gui_maszyny.py', 'narzedzia_ui/list_panel.py', 'narzedzia_ui/detail_view.py'}
          if changed != expected:
              raise SystemExit(f'Expected only {sorted(expected)}, got {sorted(changed)}')
          print('Scope check: OK')
          PY

      - name: Commit source and cleanup one-shot files
        run: |
          git add gui_maszyny.py narzedzia_ui/list_panel.py narzedzia_ui/detail_view.py
          git rm _patch_ui_sizing.py .github/workflows/patch-ui-sizing.yml
          git commit -m "style: resize tools windows and machine font"
          git push origin Rozwiniecie
