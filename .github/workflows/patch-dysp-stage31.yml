name: One-shot Dyspozycje stage 3.1

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_dysp_stage31.py'
      - '.github/workflows/patch-dysp-stage31.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved patch
        run: python _patch_dysp_stage31.py

      - name: Compile changed Python files
        run: python -m py_compile gui_zlecenia.py dyspozycje_store.py

      - name: Commit only approved source changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_zlecenia.py dyspozycje_store.py
          git rm _patch_dysp_stage31.py .github/workflows/patch-dysp-stage31.yml
          git diff --cached --check
          git commit -m "feat: track Dyspozycje performer on start"
          git push origin Rozwiniecie
