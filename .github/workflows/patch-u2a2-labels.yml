name: Patch planning terminology

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_u2a2_labels.py'
      - '.github/workflows/patch-u2a2-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved terminology patch
        run: python _patch_u2a2_labels.py

      - name: Validate Python and diff
        run: |
          python -m py_compile gui_planowanie.py gui_planowanie_bom.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          plan = Path('gui_planowanie.py').read_text(encoding='utf-8')
          bom = Path('gui_planowanie_bom.py').read_text(encoding='utf-8')
          assert 'text="SKŁAD PRODUKTU"' in plan
          assert 'text="Nr zlecenia"' in plan
          assert "'Surowiec z półproduktu'" in bom
          assert "text='Zapisz skład'" in bom
          print('Planning terminology validation OK')
          PY

      - name: Commit only approved files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_u2a2_labels.py .github/workflows/patch-u2a2-labels.yml
          git add gui_planowanie.py gui_planowanie_bom.py
          git commit -m "refactor: clarify planning terminology"
          git push origin Rozwiniecie
