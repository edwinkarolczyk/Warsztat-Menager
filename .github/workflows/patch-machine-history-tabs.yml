name: Patch machine history tabs

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-machine-history-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rozwiniecie
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin Rozwiniecie

      - name: Apply approved patch
        run: python3 _patch_machine_history_tabs.py

      - name: Compile
        run: python3 -m py_compile gui_maszyny.py

      - name: Static behavior checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('gui_maszyny.py').read_text(encoding='utf-8')
          assert '# version: 1.7' in text
          assert 'return f"{parsed.day:02d} {month} {parsed.strftime(\'%y\')}r"' in text
          assert 'notebook.add(overview_tab, text="Podgląd")' in text
          assert 'notebook.add(full_history_tab, text="Historia")' in text
          assert 'text="Ostatnia historia statusów"' in text
          assert 'text="Ostatnia historia przeglądów / serwisów"' in text
          assert 'text="Pełna historia statusów"' in text
          assert 'text="Pełna historia przeglądów / serwisów"' in text
          assert 'if status_key in {REVIEW_STATUS_DONE, REVIEW_STATUS_CANCELLED}:' in text
          assert 'entries[:5]' in text
          assert 'done_entries[:5]' in text
          assert 'tag = "overdue" if overdue else "pending"' in text
          assert 'Następny: {_format_machine_review_date(next_date)}' in text
          assert 'font=("Segoe UI", 11, "bold")' in text
          assert 'var_date = tk.StringVar(value=_format_machine_review_date(dt.date.today()))' in text
          print('Static checks: OK')
          PY

      - name: Diff validation
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          expected = {'gui_maszyny.py'}
          if changed != expected:
              raise SystemExit(f'Expected only {sorted(expected)}, got {sorted(changed)}')
          print('Scope check: OK')
          PY

      - name: Commit source changes and remove one-shot files
        run: |
          git add gui_maszyny.py
          git rm _patch_machine_history_tabs.py .github/workflows/patch-machine-history-tabs.yml
          git commit -m "feat: split machine histories and polish dates"
          git push origin Rozwiniecie
