name: One-shot restart WM after update

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_start_restart_after_update.py'
      - '.github/workflows/patch-start-restart-after-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0
      - name: Patch start.py
        run: python _patch_start_restart_after_update.py
      - name: Compile start.py
        run: python -m py_compile start.py
      - name: Show diff
        run: git diff -- start.py
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f _patch_start_restart_after_update.py .github/workflows/patch-start-restart-after-update.yml
          git add start.py _patch_start_restart_after_update.py .github/workflows/patch-start-restart-after-update.yml
          git commit -m "fix: restart WM after automatic update"
          git push origin Rozwiniecie
