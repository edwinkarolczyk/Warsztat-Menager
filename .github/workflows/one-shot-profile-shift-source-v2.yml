name: One-shot profile shift source v2

on:
  push:
    branches: [ "fix/single-source-shifts" ]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-source-shifts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytest
      - name: Patch Profile to employee anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("gui_profile_core.py")
          text = p.read_text(encoding="utf-8")

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              text = text.replace(old, new, 1)

          one("# version: 1.7.2", "# version: 1.7.3", "profile core version")
          one("# Wersja: 1.7.2", "# Wersja: 1.7.3", "profile core header version")
          one(
              "    _user_mode,\n    _week_idx,\n    _slot_for_mode,",
              "    _user_mode,\n    _week_idx_for_user,\n    _slot_for_mode,",
              "profile shift import",
          )

          old = "slot = _slot_for_mode(mode, _week_idx(now.date()))"
          if text.count(old) != 2:
              raise SystemExit(f"profile global week calls: expected 2, got {text.count(old)}")
          text = text.replace(
              old,
              "slot = _slot_for_mode(mode, _week_idx_for_user(str(login), now.date()))",
              1,
          )
          text = text.replace(
              old,
              "slot = _slot_for_mode(mode, _week_idx_for_user(str(self.login), now.date()))",
              1,
          )
          p.write_text(text, encoding="utf-8")

          for path in (Path("gui_logowanie.py"), Path("gui_settings.py")):
              data = path.read_text(encoding="utf-8")
              if "attendance.rotation_start" in data:
                  raise SystemExit(f"legacy global rotation key still used in {path}")
          if "_week_idx(now.date())" in text:
              raise SystemExit("Profile still uses global _week_idx")
          PY
      - name: Compile and run regressions
        run: |
          python -m py_compile gui_profile_core.py grafiki/shifts_schedule.py gui_logowanie.py gui_settings.py foreman_shift_profiles_runtime.py
          pytest -q tests/test_shifts_schedule.py tests/test_shifts_schedule_anchor.py test_shifts_schedule_weekend.py
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-profile-shift-source-v2.yml wm_root.json
          git config user.name "WM Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "WM: profil używa kotwicy pracownika"
          git push origin HEAD:fix/single-source-shifts
