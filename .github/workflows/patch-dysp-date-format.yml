name: Patch Dysp date format

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_dysp_date_format.py'
      - '.github/workflows/patch-dysp-date-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Verify approved source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object gui_zlecenia.py)" = "1e054d6cb5baea7fbfc5e88cb694ad2ff7e0106a"

      - name: Apply approved change
        run: python _patch_dysp_date_format.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile gui_zlecenia.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "gui_zlecenia.py"
          grep -q '# version: 1.9' gui_zlecenia.py
          grep -q '_format_dysp_deadline(order.get("termin") or order.get("deadline"))' gui_zlecenia.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('gui_zlecenia.py').read_text(encoding='utf-8'))
          text = Path('gui_zlecenia.py').read_text(encoding='utf-8')
          assert '_DYSP_WEEKDAY_LABELS_PL = ("Pon", "Wt", "Śr", "Czw", "Pt", "Sob", "Nie")' in text
          assert 'date_text = parsed_date.strftime("%d-%m-%y")' in text
          print('Dysp date format source: OK')
          PY

      - name: Commit approved source and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui_zlecenia.py
          git rm _patch_dysp_date_format.py .github/workflows/patch-dysp-date-format.yml
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/patch-dysp-date-format.yml _patch_dysp_date_format.py gui_zlecenia.py | sort)"
          test "$staged" = "$expected"
          git commit -m 'style: align dyspozycje date format with machines'
          git push origin Rozwiniecie
