name: Patch tools config warning

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_tools_config_warning.py'
      - '.github/workflows/patch-tools-config-warning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved patch
        run: python _patch_tools_config_warning.py

      - name: Validate
        run: |
          python -m py_compile gui_narzedzia.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('gui_narzedzia.py').read_text(encoding='utf-8')
          assert '# version: 1.5.32' in text
          legacy = 'if not _clean_list(cfg.get("szablony_zadan_narzedzia_stare")):\n        missing.append("zadania (serwis)")'
          assert legacy not in text
          assert 'def _stare_convert_templates_from_config' in text
          print('Tools config warning fix OK')
          PY

      - name: Commit approved source file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_tools_config_warning.py .github/workflows/patch-tools-config-warning.yml
          git add gui_narzedzia.py
          git commit -m "fix: stop false tools service config warning"
          git push origin Rozwiniecie
