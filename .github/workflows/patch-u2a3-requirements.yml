name: Patch U2A-3 order requirements

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_u2a3_gui1.py'
      - '_patch_u2a3_gui2.py'
      - '.github/workflows/patch-u2a3-requirements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved U2A-3 GUI patch
        run: |
          python _patch_u2a3_gui1.py
          python _patch_u2a3_gui2.py

      - name: Validate Python and diff
        run: |
          python -m py_compile gui_planowanie.py planowanie_zapotrzebowanie.py produkty_store.py polprodukty_store.py
          git diff --check

      - name: Validate requirements calculation
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          import types
          from pathlib import Path

          fake = types.ModuleType('config_manager')
          fake.ConfigManager = object
          sys.modules['config_manager'] = fake

          from produkty_store import ProductCatalog
          from polprodukty_store import SemiProductCatalog
          from planowanie_zapotrzebowanie import RequirementCalculator, unique_order_number

          class FakeCfg:
              def __init__(self, root): self.root = Path(root)
              def path_data(self, *parts): return str(self.root / 'data' / Path(*parts))
              def path_backup(self, *parts): return str(self.root / 'backup' / Path(*parts))

          with tempfile.TemporaryDirectory() as tmp:
              cfg = FakeCfg(tmp)
              pdir = Path(cfg.path_data('produkty')); pdir.mkdir(parents=True, exist_ok=True)
              sdir = Path(cfg.path_data('polprodukty')); sdir.mkdir(parents=True, exist_ok=True)

              (pdir / 'PROD.json').write_text(json.dumps({
                  'kod': 'PROD', 'nazwa': 'Produkt', 'bom_revision': 2,
                  'polprodukty': [
                      {'kod': 'ZBIJAK', 'ilosc_na_szt': 20},
                      {'kod': 'ZAWLECZKA', 'ilosc_na_szt': 20},
                      {'kod': 'LANCUSZEK', 'ilosc_na_szt': 20}
                  ]
              }), encoding='utf-8')
              rows = {
                  'ZBIJAK': {'kod':'ZBIJAK','nazwa':'Zbijak','surowiec':{'kod':'DRUT8','ilosc_na_szt':0.1,'jednostka':'mb'}},
                  'ZAWLECZKA': {'kod':'ZAWLECZKA','nazwa':'Zawleczka','surowiec':{'kod':'DRUT2','ilosc_na_szt':0.05,'jednostka':'mb'}},
                  'LANCUSZEK': {'kod':'LANCUSZEK','nazwa':'Łańcuszek','polprodukty':[{'kod':'OCZKO','ilosc_na_szt':20}]},
                  'OCZKO': {'kod':'OCZKO','nazwa':'Oczko','surowiec':{'kod':'DRUT2','ilosc_na_szt':0.02,'jednostka':'mb'}}
              }
              for code, payload in rows.items():
                  (sdir / f'{code}.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')

              calc = RequirementCalculator(ProductCatalog(cfg), SemiProductCatalog(cfg))
              result = calc.calculate('PROD', 30)
              by_type_code = {(r['typ'], r['kod']): r for r in result['rows']}
              assert by_type_code[('Półprodukt','ZBIJAK')]['ilosc'] == 600
              assert by_type_code[('Półprodukt','ZAWLECZKA')]['ilosc'] == 600
              assert by_type_code[('Półprodukt','LANCUSZEK')]['ilosc'] == 600
              assert by_type_code[('Półprodukt','OCZKO')]['ilosc'] == 12000
              assert abs(by_type_code[('Surowiec','DRUT8')]['ilosc'] - 60.0) < 1e-9
              assert abs(by_type_code[('Surowiec','DRUT2')]['ilosc'] - 270.0) < 1e-9

              orders = [{'id':'1','number':'1254'}, {'id':'2','number':'1254_2'}]
              assert unique_order_number('1254', orders) == '1254_3'
              assert unique_order_number('1254', orders, exclude_id='1') == '1254'
          print('U2A-3 requirements OK')
          PY

      - name: Commit approved U2A-3 GUI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _patch_u2a3_gui1.py _patch_u2a3_gui2.py .github/workflows/patch-u2a3-requirements.yml
          git add gui_planowanie.py planowanie_zapotrzebowanie.py
          git commit -m "feat: connect orders to product requirements"
          git push origin Rozwiniecie
