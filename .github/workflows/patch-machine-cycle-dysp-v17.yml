name: Patch machine cycle Dyspozycje v1.7

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_machine_cycle_dysp_v17.py'
      - '.github/workflows/patch-machine-cycle-dysp-v17.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved machine cycle Dyspozycje hook
        run: python _patch_machine_cycle_dysp_v17.py

      - name: Validate Python and scope
        run: |
          python -m py_compile gui_zlecenia.py maszyny_dyspozycje.py
          git diff --check
          test "$(git diff --name-only)" = "gui_zlecenia.py"

      - name: Validate yearly cycle Dyspozycje
        run: |
          python - <<'PY'
          import datetime as dt
          import maszyny_dyspozycje as md

          machine = {
              'id': '42',
              'nazwa': 'BLELL',
              'typ': 'Strugarka',
              'review_months': [9],
              'reviews': [],
          }

          specs_2026 = md.collect_due_machine_cycle_specs(
              [machine], [], today=dt.date(2026, 8, 25)
          )
          assert len(specs_2026) == 1, specs_2026
          spec_2026 = specs_2026[0]
          assert spec_2026['typ_dyspozycji'] == 'maszyna'
          assert spec_2026['obiekt_id'] == '42'
          assert spec_2026['termin'] == '2026-09-01'
          assert spec_2026['meta']['auto_key'] == 'machine-cycle-review:42:2026:09'
          assert 'dodana automatycznie' in spec_2026['opis'].lower()
          assert 'Strugarka' in spec_2026['opis']

          specs_duplicate = md.collect_due_machine_cycle_specs(
              [machine],
              [{'meta': {'auto_source': md.AUTO_SOURCE, 'auto_key': spec_2026['meta']['auto_key']}}],
              today=dt.date(2026, 8, 25),
          )
          assert specs_duplicate == [], specs_duplicate

          specs_2027 = md.collect_due_machine_cycle_specs(
              [machine], [], today=dt.date(2027, 8, 25)
          )
          assert len(specs_2027) == 1, specs_2027
          assert specs_2027[0]['termin'] == '2027-09-01'
          assert specs_2027[0]['meta']['auto_key'] == 'machine-cycle-review:42:2027:09'

          january_machine = dict(machine)
          january_machine['review_months'] = [1]
          specs_next_year = md.collect_due_machine_cycle_specs(
              [january_machine], [], today=dt.date(2026, 12, 26)
          )
          assert len(specs_next_year) == 1, specs_next_year
          assert specs_next_year[0]['termin'] == '2027-01-01'

          done_machine = dict(machine)
          done_machine['reviews'] = [{
              'type': 'Przegląd okresowy',
              'planned_date': '2026-09-01',
              'status': 'done',
          }]
          specs_done = md.collect_due_machine_cycle_specs(
              [done_machine], [], today=dt.date(2026, 8, 25)
          )
          assert specs_done == [], specs_done
          print('yearly machine cycle Dyspozycje OK')
          PY

      - name: Commit approved source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_zlecenia.py
          git rm -f _patch_machine_cycle_dysp_v17.py .github/workflows/patch-machine-cycle-dysp-v17.yml
          git commit -m "feat: create Dyspozycje for machine cycle reviews"
          git push origin Rozwiniecie
