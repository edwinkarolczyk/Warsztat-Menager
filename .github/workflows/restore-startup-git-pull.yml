name: One-shot restore startup git pull

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - .github/workflows/restore-startup-git-pull.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0
      - name: Patch start.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("start.py")
          text = path.read_text(encoding="utf-8")

          old_header = """# WM-VERSION: 0.1\n# version: 1.1.3\n# Moduł: start\n# Zmiany 1.1.3:\n# - Wyłączono synchroniczne operacje Git przy starcie aplikacji, aby sieć/repozytorium nie blokowały GUI.\n# - Aktualizacja repozytorium nie jest wykonywana automatycznie przed uruchomieniem okna WM.\n"""
          new_header = """# WM-VERSION: 0.1\n# version: 1.1.4\n# Moduł: start\n# Zmiany 1.1.4:\n# - Przywrócono automatyczny git fetch/pull z gałęzi Rozwiniecie przy uruchomieniu WM.\n# - Aktualizacja wykonywana jest tylko raz, przed main(); późniejsze wywołania Git podczas budowy logowania pozostają blokowane.\n# Zmiany 1.1.3:\n# - Wyłączono synchroniczne operacje Git przy starcie aplikacji, aby sieć/repozytorium nie blokowały GUI.\n# - Aktualizacja repozytorium nie jest wykonywana automatycznie przed uruchomieniem okna WM.\n"""
          if old_header not in text:
              raise SystemExit("Nie znaleziono nagłówka start.py 1.1.3")
          text = text.replace(old_header, new_header, 1)

          old_bottom = """    # --- Koniec integracji manifestu ---\n    # Git check/pull przy starcie wyłączony: nie blokujemy uruchamiania WM.\n    main()\n"""
          new_bottom = """    # --- Koniec integracji manifestu ---\n    # Przywrócony automatyczny Git check/pull przy starcie.\n    # Na czas tej jednej operacji wyłączamy blokadę bootstrapową z updates_utils,\n    # po czym włączamy ją z powrotem przed budową GUI/logowania.\n    BOOTSTRAP_ACTIVE = False\n    try:\n        _wm_git_check_on_start()\n    finally:\n        BOOTSTRAP_ACTIVE = True\n    main()\n"""
          if old_bottom not in text:
              raise SystemExit("Nie znaleziono bloku końcowego start.py")
          text = text.replace(old_bottom, new_bottom, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/restore-startup-git-pull.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add start.py .github/workflows/restore-startup-git-pull.yml
          git commit -m "fix: restore automatic git pull at startup"
          git push origin Rozwiniecie
