name: WMT 1.0 EXE Build

on:
  push:
    branches: [ WMT-1.0 ]
    paths:
      - 'WMT/**'
      - '11.ico'
      - '.github/workflows/wmt_exe.yml'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore WMT.py
        shell: pwsh
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path(r'WMT/WMT.py.gz.b64'); pathlib.Path(r'WMT/WMT.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text(encoding='ascii'))))"
          python -m py_compile WMT/WMT.py

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Build WMT.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMT --icon 11.ico WMT/WMT.py --distpath WMT/dist --workpath WMT/build
          if (-not (Test-Path "WMT/dist/WMT.exe")) { throw "Brak WMT.exe" }

      - name: Verify and pack
        shell: pwsh
        run: |
          $exe = "WMT/dist/WMT.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  WMT.exe" | Set-Content "WMT/dist/SHA256SUMS.txt" -Encoding ascii
          Copy-Item "WMT/README.md" "WMT/dist/README.md"
          Compress-Archive -Path "WMT/dist/WMT.exe","WMT/dist/README.md","WMT/dist/SHA256SUMS.txt" -DestinationPath "WMT/dist/WMT-1.0.0-win64.zip" -CompressionLevel Optimal
          Get-Item "WMT/dist/WMT.exe","WMT/dist/WMT-1.0.0-win64.zip" | Select-Object Name,Length

      - name: Upload WMT 1.0
        uses: actions/upload-artifact@v4
        with:
          name: WMT-1.0.0-win64
          path: |
            WMT/dist/WMT.exe
            WMT/dist/WMT-1.0.0-win64.zip
            WMT/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
