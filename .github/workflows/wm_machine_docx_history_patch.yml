name: WM Machine DOCX history patch

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/wm_machine_docx_history_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch gui_maszyny.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('gui_maszyny.py')
          text = path.read_text(encoding='utf-8')

          def rep(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              text = text.replace(old, new, 1)

          rep(
              '# version: 1.8\n# Zmiany 1.8:',
              '# version: 1.9\n'
              '# Zmiany 1.9:\n'
              '# - Każda maszyna może mieć przypisaną dodatkową kartę historii .docx.\n'
              '# - Zakończony przegląd dopisuje wpis P, a zamknięta awaria wpis N.\n'
              '# - Wybór karty historii dopuszcza wyłącznie format .docx.\n'
              '# Zmiany 1.8:',
              'version header',
          )

          helper = '''\n\ndef _append_machine_service_history(\n    machine: Dict[str, Any],\n    *,\n    entry_type: str,\n    performed_at: object,\n    performed_by: object,\n    description: object,\n    parent: tk.Misc | None = None,\n    cfg: Any | None = None,\n) -> bool:\n    \"\"\"Dodatkowo dopisz historię do przypisanej karcie DOCX maszyny.\"\"\"\n\n    stored_path = str(machine.get(\"service_history_file\") or \"\").strip()\n    if not stored_path:\n        return False\n\n    absolute = _resolve_card_absolute(stored_path, cfg)\n    if Path(absolute).suffix.casefold() != \".docx\":\n        messagebox.showwarning(\n            \"Karta historii maszyny\",\n            \"Przypisana karta historii nie jest plikiem .docx.\\n\"\n            \"Wybierz poprawny plik w Edycji maszyny.\",\n            parent=parent,\n        )\n        return False\n    if not absolute or not os.path.isfile(absolute):\n        messagebox.showwarning(\n            \"Karta historii maszyny\",\n            f\"Historia WM została zapisana, ale plik karty nie istnieje:\\n{absolute}\",\n            parent=parent,\n        )\n        return False\n\n    try:\n        from machine_history_doc import append_history_entry\n\n        append_history_entry(\n            absolute,\n            entry_type=entry_type,\n            performed_at=performed_at,\n            performed_by=performed_by,\n            description=description,\n        )\n        return True\n    except Exception as exc:\n        logger.exception(\n            \"[Maszyny][DOCX_HISTORY] Nie udało się dopisać historii do %s\",\n            absolute,\n        )\n        messagebox.showwarning(\n            \"Karta historii maszyny\",\n            \"Historia w WM została zapisana, ale nie udało się dopisać \"\n            f\"wpisu do karty DOCX:\\n{exc}\",\n            parent=parent,\n        )\n        return False\n'''
          rep(
              '\n\n_EXCEL_FIELD_ALIASES: Dict[str, Tuple[str, ...]] = {',
              helper + '\n\n_EXCEL_FIELD_ALIASES: Dict[str, Tuple[str, ...]] = {',
              'docx helper insertion',
          )

          card_ui = '''\n\n            service_history_frame = ttk.LabelFrame(\n                frm, text=\"Dodatkowa karta historii przeglądów i napraw\"\n            )\n            service_history_frame.grid(\n                row=9, column=0, columnspan=3, sticky=\"ew\", padx=6, pady=(8, 4)\n            )\n            self.service_history_label = ttk.Label(service_history_frame)\n            self.service_history_label.pack(side=\"left\", padx=(8, 12), pady=6)\n            ttk.Button(\n                service_history_frame,\n                text=\"Wybierz plik .docx...\",\n                command=self._choose_service_history_file,\n            ).pack(side=\"left\", padx=(0, 6), pady=6)\n            self.service_history_open_button = ttk.Button(\n                service_history_frame,\n                text=\"Otwórz kartę\",\n                command=self._open_service_history_file,\n            )\n            self.service_history_open_button.pack(side=\"left\", pady=6)\n            self._refresh_service_history_label()\n'''
          rep(
              '            self._refresh_image_label()\n\n            selected_review_months = set(',
              '            self._refresh_image_label()' + card_ui + '\n            selected_review_months = set(',
              'edit dialog card UI',
          )

          rep(
              '            review_box.grid(\n                row=9, column=0, columnspan=2, sticky=\"ew\", pady=(10, 4)\n            )',
              '            review_box.grid(\n                row=10, column=0, columnspan=2, sticky=\"ew\", pady=(10, 4)\n            )',
              'shift review box',
          )

          methods = '''\n\n        def _choose_service_history_file(self) -> None:\n            path = filedialog.askopenfilename(\n                parent=self,\n                title=\"Wybierz kartę historii maszyny (.docx)\",\n                filetypes=((\"Dokument Word DOCX\", \"*.docx\"),),\n            )\n            if not path:\n                return\n            if Path(path).suffix.casefold() != \".docx\":\n                messagebox.showwarning(\n                    \"Karta historii maszyny\",\n                    \"Można wybrać tylko plik w formacie .docx.\",\n                    parent=self,\n                )\n                return\n            self._row[\"service_history_file\"] = _resolve_card_storage(\n                path, cfg_manager\n            )\n            self._dirty = True\n            self._refresh_service_history_label()\n\n        def _open_service_history_file(self) -> None:\n            stored = str(self._row.get(\"service_history_file\") or \"\").strip()\n            if not stored:\n                return\n            absolute = _resolve_card_absolute(stored, cfg_manager)\n            if not absolute or not os.path.isfile(absolute):\n                messagebox.showerror(\n                    \"Karta historii maszyny\",\n                    f\"Plik nie istnieje:\\n{absolute}\",\n                    parent=self,\n                )\n                return\n            if not _open_external(absolute):\n                messagebox.showerror(\n                    \"Karta historii maszyny\",\n                    \"Nie udało się otworzyć pliku.\",\n                    parent=self,\n                )\n\n        def _refresh_service_history_label(self) -> None:\n            stored = str(self._row.get(\"service_history_file\") or \"\").strip()\n            if stored:\n                self.service_history_label.configure(\n                    text=f\"Plik: {os.path.basename(stored)}\"\n                )\n                self.service_history_open_button.state([\"!disabled\"])\n            else:\n                self.service_history_label.configure(text=\"Plik: brak\")\n                self.service_history_open_button.state([\"disabled\"])\n'''
          rep(
              '            self.image_label.configure(text=f\"Zdjęcie: {image_name}\")\n\n        def _ok(self, x, y):',
              '            self.image_label.configure(text=f\"Zdjęcie: {image_name}\")' + methods + '\n\n        def _ok(self, x, y):',
              'edit dialog card methods',
          )

          rep(
              '                \"review_workers\": [\n                    login\n                    for login, var in self.review_worker_vars.items()\n                    if bool(var.get())\n                ],\n            }',
              '                \"review_workers\": [\n                    login\n                    for login, var in self.review_worker_vars.items()\n                    if bool(var.get())\n                ],\n                \"service_history_file\": str(\n                    self._row.get(\"service_history_file\") or \"\"\n                ).strip(),\n            }',
              'persist service history path',
          )

          rep(
              '                machine.update(updated)\n                _persist_machine_after_review_change(updated)\n                _refresh_history_tree()',
              '                machine.update(updated)\n                _persist_machine_after_review_change(updated)\n                _append_machine_service_history(\n                    updated,\n                    entry_type=\"P\",\n                    performed_at=target_entry.get(\"completed_at\"),\n                    performed_by=completed_by,\n                    description=(\n                        target_entry.get(\"result_note\")\n                        or target_entry.get(\"description\")\n                        or target_entry.get(\"type\")\n                        or \"Przegląd / serwis\"\n                    ),\n                    parent=dialog,\n                    cfg=cfg_manager,\n                )\n                _refresh_history_tree()',
              'P history write',
          )

          rep(
              '            payload = dict(machine)\n            payload[\"status\"] = old_status\n            _apply_machine_status_change(\n                payload,\n                new_status,\n                actor=_active_login_for_machine(root),\n                note=note,\n                photos=status_photos,\n            )',
              '            payload = dict(machine)\n            payload[\"status\"] = old_status\n            actor = _active_login_for_machine(root)\n            _apply_machine_status_change(\n                payload,\n                new_status,\n                actor=actor,\n                note=note,\n                photos=status_photos,\n            )',
              'status actor reuse',
          )

          rep(
              '            rows_cache = list(persisted)\n            _on_rows_changed()\n            _set_selected_machine(machine_id)\n            win.destroy()',
              '            rows_cache = list(persisted)\n            _on_rows_changed()\n            _set_selected_machine(machine_id)\n            if old_status == \"warn\" and new_status == \"ok\":\n                status_history = payload.get(\"status_history\")\n                closed_at = \"\"\n                if isinstance(status_history, list) and status_history:\n                    last_status = status_history[-1]\n                    if isinstance(last_status, dict):\n                        closed_at = str(last_status.get(\"ended_at\") or \"\")\n                _append_machine_service_history(\n                    payload,\n                    entry_type=\"N\",\n                    performed_at=closed_at or _machine_now_iso(),\n                    performed_by=[actor],\n                    description=note or \"Naprawa / przywrócenie sprawności\",\n                    parent=win,\n                    cfg=cfg_manager,\n                )\n            win.destroy()',
              'N history write',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check python-docx pytest

      - name: Compile changed Python
        run: python -m py_compile gui_maszyny.py machine_history_doc.py

      - name: Test DOCX history writer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from machine_history_doc import append_history_entry

          path = Path('/tmp/wm_machine_history_test.docx')
          doc = Document()
          table = doc.add_table(rows=2, cols=4)
          for cell, value in zip(
              table.rows[0].cells,
              ('TYP', 'DATA PRZEGLĄDU/NAPRAWY', 'PODPIS', 'UWAGI/OPIS'),
          ):
              cell.text = value
          doc.save(path)

          append_history_entry(
              path,
              entry_type='P',
              performed_at='2026-08-26T15:30:00',
              performed_by=['Edwin Karolczyk'],
              description='Kontrola i smarowanie',
          )
          append_history_entry(
              path,
              entry_type='N',
              performed_at='2026-08-27T08:00:00',
              performed_by=['Edwin Karolczyk', 'Marek Czopik'],
              description='Wymiana łożyska',
          )

          out = Document(path)
          rows = out.tables[0].rows
          assert rows[1].cells[0].text == 'P'
          assert rows[1].cells[1].text == '26.08.26'
          assert rows[1].cells[2].text == 'EK'
          assert rows[1].cells[3].text == 'Kontrola i smarowanie'
          assert rows[2].cells[0].text == 'N'
          assert rows[2].cells[2].text == 'EK, MC'
          assert rows[2].cells[3].text == 'Wymiana łożyska'
          print('DOCX_HISTORY_TEST=OK')
          PY

      - name: Run repository pytest
        shell: bash
        run: |
          set +e
          pytest -q > /tmp/pytest.log 2>&1
          code=$?
          tail -n 40 /tmp/pytest.log
          echo "FULL_PYTEST_EXIT=$code"
          exit 0

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'WM automation'
          git config user.email 'wm-automation@users.noreply.github.com'
          git rm .github/workflows/wm_machine_docx_history_patch.yml
          git add gui_maszyny.py
          git commit -m 'WM: dodatkowa historia maszyn w DOCX'
          git push origin HEAD:Rozwiniecie
          git push origin --delete wm-docx-history-temp wm-docx-history-temp2 || true
