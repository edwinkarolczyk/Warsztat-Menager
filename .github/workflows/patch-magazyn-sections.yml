name: Patch warehouse sections

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '.github/workflows/patch-magazyn-sections.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply approved warehouse patch
        run: python tools/_patch_magazyn_sections.py

      - name: Validate source
        run: |
          python -m py_compile gui_magazyn.py
          python - <<'PY'
          from pathlib import Path
          s = Path('gui_magazyn.py').read_text(encoding='utf-8')
          required = [
              '# version: 1.8.0',
              'WAREHOUSE_SECTIONS = ("(wszystkie)", "Surowce", "Półprodukty", "Produkty")',
              'self.tree.heading("rezerwacje", text="Zarezerwowane")',
              'self.tree.heading("dostepne", text="Dostępne")',
              'self.tree.heading("jednostka", text="Jednostka")',
              'self.tree.heading("lokalizacja", text="Lokalizacja")',
              'LM.load_magazyn(include_external=True)',
              'dostepne = max(0.0, stan - rezerwacje)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing expected patch markers: {missing}')
          print('warehouse patch markers OK')
          PY
          git diff --check

      - name: Commit approved source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui_magazyn.py
          git rm -f tools/_patch_magazyn_sections.py .github/workflows/patch-magazyn-sections.yml
          git commit -m 'feat: organize warehouse stock view'
          git push origin Rozwiniecie
