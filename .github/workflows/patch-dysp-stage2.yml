name: One-shot Dyspozycje stage 2

on:
  push:
    branches: [Rozwiniecie]
    paths:
      - '_patch_dysp_stage2.py'
      - '.github/workflows/patch-dysp-stage2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Rozwiniecie
          fetch-depth: 0

      - name: Apply narrow patch
        run: python _patch_dysp_stage2.py

      - name: Compile changed modules
        run: python -m py_compile gui_zlecenia.py dyspozycje_store.py

      - name: Diff check
        run: git diff --check

      - name: Commit only approved files and cleanup helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_zlecenia.py dyspozycje_store.py
          git rm _patch_dysp_stage2.py .github/workflows/patch-dysp-stage2.yml
          mapfile -t files < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/patch-dysp-stage2.yml"
            "_patch_dysp_stage2.py"
            "dyspozycje_store.py"
            "gui_zlecenia.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${files[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Unexpected staged files:"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          git commit -m "feat: add Dyspozycje status workflow"
          git push origin Rozwiniecie
